<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Management — Gaming Sanctuary Admin</title>
  <meta name="description" content="Manage café menu items at Gaming Sanctuary." />
  <link rel="stylesheet" href="/css/main.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <div class="app-layout admin-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="/admin/dashboard.html" class="sidebar-logo">
        <div class="sidebar-logo-icon">🎮</div>
        <div><div class="sidebar-logo-text">Sanctuary</div><div class="sidebar-logo-sub">Admin Panel</div></div>
      </a>
      <span class="sidebar-section-label">Overview</span>
      <a href="/admin/dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="/admin/analytics.html" class="nav-link"><i data-lucide="bar-chart-2"></i><span>Analytics</span></a>
      <span class="sidebar-section-label">Operations</span>
      <a href="/admin/schedule.html" class="nav-link"><i data-lucide="calendar-range"></i><span>Schedule</span></a>
      <a href="/admin/walk-in.html" class="nav-link"><i data-lucide="user-plus"></i><span>Walk-In</span></a>
      <a href="/admin/rigs.html" class="nav-link"><i data-lucide="monitor"></i><span>Rigs</span></a>
      <a href="/admin/orders.html" class="nav-link"><i data-lucide="chef-hat"></i><span>Kitchen (KDS)</span></a>
      <a href="/admin/menu.html" class="nav-link active"><i data-lucide="utensils"></i><span>Menu Items</span></a>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info"><div class="sidebar-user-name" id="sidebar-name">…</div><div class="sidebar-user-role" style="color:var(--amber)">Admin</div></div>
        </div>
        <button class="btn btn-ghost btn-full mt-1" id="logout-btn" style="font-size:0.8rem"><i data-lucide="log-out"></i><span>Sign Out</span></button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Menu Management</h1>
          <p class="page-subtitle">Add, edit, and toggle menu items</p>
        </div>
        <button class="btn btn-primary" id="add-item-btn">
          <i data-lucide="plus"></i> Add Item
        </button>
      </div>

      <div class="page-body">
        <div class="card" style="padding:0">
          <div id="menu-table">
            <div class="loading-state"><div class="spinner"></div> Loading…</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay hidden" id="item-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="item-modal-title">Add Menu Item</span>
        <button class="modal-close" onclick="closeItemModal()"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Item name</label>
          <input class="input" type="text" id="item-name" placeholder="e.g. Monster Energy" />
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <input class="input" type="text" id="item-desc" placeholder="Short description" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Price (₹)</label>
            <input class="input" type="number" id="item-price" placeholder="150" min="0" step="0.01" />
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="input" id="item-category">
              <option value="drinks">🥤 Drinks</option>
              <option value="food">🍔 Food</option>
              <option value="snacks">🍟 Snacks</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Image URL (optional)</label>
          <input class="input" type="url" id="item-image" placeholder="https://…" />
        </div>
        <div style="display:flex;align-items:center;gap:0.75rem;margin-top:0.25rem">
          <label class="toggle">
            <input type="checkbox" id="item-available" checked />
            <span class="toggle-slider"></span>
          </label>
          <label class="form-label" for="item-available" style="margin:0">Available for ordering</label>
        </div>
        <p class="error-msg" id="item-error"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeItemModal()">Cancel</button>
        <button class="btn btn-primary" id="item-save-btn"><i data-lucide="save"></i> Save Item</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, signOut } from '/js/auth-guard.js';
    import { supabase } from '/js/supabase-client.js';
    import { showToast, fmtPrice, confirmDialog, setLoading, avatarInitials } from '/js/utils.js';

    const auth = await requireAuth('admin');
    if (!auth) throw new Error('redirecting');
    const { profile } = auth;

    document.getElementById('sidebar-name').textContent = profile.name;
    document.getElementById('sidebar-avatar').textContent = avatarInitials(profile.name);
    lucide.createIcons();

    document.getElementById('logout-btn').onclick = async () => {
      if (await confirmDialog('Sign out?', 'Sign Out')) { showToast('Signed out', 'info'); await signOut(); }
    };
    lucide.createIcons();

    const CATEGORY_ICONS = { drinks: '🥤', food: '🍔', snacks: '🍟' };
    let editingId = null;

    async function loadMenu() {
      const el = document.getElementById('menu-table');
      el.innerHTML = '<div class="loading-state"><div class="spinner"></div> Loading…</div>';
      const { data, error } = await supabase.from('menu_items').select('*').order('category').order('name');
      if (error) { showToast(error.message, 'error'); return; }
      if (!data || data.length === 0) {
        el.innerHTML = `<div class="empty-state"><span class="empty-state-icon">🍽️</span><h3>No menu items</h3></div>`;
        return;
      }
      el.innerHTML = `
        <div class="table-wrap" style="border:none">
          <table>
            <thead>
              <tr><th>Item</th><th>Category</th><th>Price</th><th>Available</th><th>Actions</th></tr>
            </thead>
            <tbody>
              ${data.map(item => `
                <tr>
                  <td>
                    <div style="display:flex;align-items:center;gap:0.75rem">
                      <span style="font-size:1.5rem">${CATEGORY_ICONS[item.category] || '🍽️'}</span>
                      <div>
                        <div style="font-weight:600;font-size:0.9rem">${item.name}</div>
                        <div class="text-muted text-xs">${item.description.slice(0,50)}${item.description.length>50?'…':''}</div>
                      </div>
                    </div>
                  </td>
                  <td><span class="badge ${item.category === 'drinks' ? 'badge-teal' : item.category === 'food' ? 'badge-purple' : 'badge-amber'}">${item.category}</span></td>
                  <td><strong>${fmtPrice(item.price)}</strong></td>
                  <td>
                    <label class="toggle">
                      <input type="checkbox" ${item.available ? 'checked' : ''} onchange="toggleAvailable(${item.id}, this.checked)" />
                      <span class="toggle-slider"></span>
                    </label>
                  </td>
                  <td>
                    <div class="actions-cell">
                      <button class="btn btn-ghost btn-sm" onclick="editItem(${item.id})"><i data-lucide="pencil"></i> Edit</button>
                      <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id}, '${item.name}')"><i data-lucide="trash-2"></i></button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      lucide.createIcons();
    }

    // ── Toggle available ─────────────────────────────────────────
    window.toggleAvailable = async (id, available) => {
      try {
        const { error } = await supabase.from('menu_items').update({ available }).eq('id', id);
        if (error) throw error;
        showToast(available ? 'Item enabled' : 'Item disabled', 'success');
      } catch (err) {
        showToast(err.message, 'error');
        await loadMenu(); // revert
      }
    };

    // ── Modal ────────────────────────────────────────────────────
    document.getElementById('add-item-btn').onclick = () => {
      editingId = null;
      document.getElementById('item-modal-title').textContent = 'Add Menu Item';
      document.getElementById('item-name').value      = '';
      document.getElementById('item-desc').value      = '';
      document.getElementById('item-price').value     = '';
      document.getElementById('item-category').value  = 'drinks';
      document.getElementById('item-image').value     = '';
      document.getElementById('item-available').checked = true;
      document.getElementById('item-error').classList.remove('show');
      document.getElementById('item-modal').classList.remove('hidden');
      lucide.createIcons();
    };

    window.closeItemModal = () => document.getElementById('item-modal').classList.add('hidden');
    document.getElementById('item-modal').onclick = e => { if (e.target.id === 'item-modal') closeItemModal(); };

    window.editItem = async (id) => {
      const { data } = await supabase.from('menu_items').select('*').eq('id', id).single();
      if (!data) return;
      editingId = id;
      document.getElementById('item-modal-title').textContent = 'Edit Menu Item';
      document.getElementById('item-name').value      = data.name;
      document.getElementById('item-desc').value      = data.description;
      document.getElementById('item-price').value     = data.price;
      document.getElementById('item-category').value  = data.category;
      document.getElementById('item-image').value     = data.image_url || '';
      document.getElementById('item-available').checked = data.available;
      document.getElementById('item-error').classList.remove('show');
      document.getElementById('item-modal').classList.remove('hidden');
      lucide.createIcons();
    };

    document.getElementById('item-save-btn').onclick = async () => {
      const btn   = document.getElementById('item-save-btn');
      const errEl = document.getElementById('item-error');
      const name  = document.getElementById('item-name').value.trim();
      const desc  = document.getElementById('item-desc').value.trim();
      const price = parseFloat(document.getElementById('item-price').value);
      const cat   = document.getElementById('item-category').value;
      const img   = document.getElementById('item-image').value.trim() || null;
      const avail = document.getElementById('item-available').checked;
      errEl.classList.remove('show');

      if (!name) { errEl.textContent = 'Name is required.'; errEl.classList.add('show'); return; }
      if (!desc) { errEl.textContent = 'Description is required.'; errEl.classList.add('show'); return; }
      if (isNaN(price) || price < 0) { errEl.textContent = 'Valid price is required.'; errEl.classList.add('show'); return; }

      setLoading(btn, true, 'Saving…');
      try {
        const payload = { name, description: desc, price, category: cat, image_url: img, available: avail };
        if (editingId) {
          const { error } = await supabase.from('menu_items').update(payload).eq('id', editingId);
          if (error) throw error;
          showToast(`${name} updated`, 'success');
        } else {
          const { error } = await supabase.from('menu_items').insert(payload);
          if (error) throw error;
          showToast(`${name} added`, 'success');
        }
        closeItemModal();
        await loadMenu();
        setLoading(btn, false);
        lucide.createIcons();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
        setLoading(btn, false);
        lucide.createIcons();
      }
    };

    window.deleteItem = async (id, name) => {
      const ok = await confirmDialog(`Delete <strong>${name}</strong> from the menu?`, 'Delete Item');
      if (!ok) return;
      try {
        const { error } = await supabase.from('menu_items').delete().eq('id', id);
        if (error) throw error;
        showToast(`${name} deleted`, 'success');
        await loadMenu();
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    await loadMenu();
  </script>
</body>
</html>
